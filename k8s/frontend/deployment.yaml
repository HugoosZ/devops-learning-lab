apiVersion: apps/v1 # La version va a cambiar depende del tipo de Recurso (En este caso Deployment)
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          #image: dressy/devops-frontend:7dea02a939f87c3cdd18f161c686d4134396f5e3
          image: southamerica-west1-docker.pkg.dev/project-3467abaf-14aa-4dd9-ac1/devops-repo/frontend:v1
          #resources: # <--- ESTO ES LO QUE PERMITE EL ESCALADO DINÁMICO
            #requests:
              #cpu: "100m"
              #memory: "128Mi"
            #limits:
              #cpu: "200m"
              #memory: "256Mi"
          imagePullPolicy: Always
          #image: frontend:latest
          #imagePullPolicy: Never
          ports:
            - containerPort: 3000
